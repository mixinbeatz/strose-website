    if (!f) return '';
    if (f.stringValue !== undefined) return f.stringValue;
    if (f.booleanValue !== undefined) return f.booleanValue;
    if (f.integerValue !== undefined) return f.integerValue;
    return '';
  }

  async function loadAdvertisers() {
    try {
      const res = await fetch(ADVERTISERS_URL);
      if (!res.ok) throw new Error('fetch failed');
      const data = await res.json();
      const docs = data.documents || [];
      // Field mapping mirrors CommunityScreen.tsx's mapDoc() exactly (name, tierPlan
      // fallback to tier, specialties as a comma/newline-delimited string, logoUrl/
      // modalLogoUrl/modalHeroUrl as Storage download URLs, Parish Pro listings
      // excluded) so the website surfaces the same fields the app does — no more,
      // no less. `about` has no separate Firestore field; the app aliases it to
      // `description`, mirrored below.
      const mapped = docs
        .map(d => ({ id: d.name.split('/').pop(), fields: d.fields || {} }))
        .filter(({ fields: f }) => fsVal(f.active) !== false)   // paused listings hidden
        .map(({ id, fields: f }) => {
          const rawTier = String(fsVal(f.tierPlan) || fsVal(f.tier) || 'standard').toLowerCase();
          const isPro = rawTier.includes('parish') || rawTier.includes('pro');
          const specialties = String(fsVal(f.specialties) || '').split(/\r?\n|,/).map(s => s.trim()).filter(Boolean);
          const acceptTexts = fsVal(f.acceptTexts) === true;
          return {
            id,
            name: fsVal(f.name),
            category: fsVal(f.category) || 'Services',
            description: fsVal(f.description),
            about: fsVal(f.description),
            tagline: fsVal(f.tagline) || null,
            phone: fsVal(f.phone) || null,
            smsNumber: (acceptTexts ? (fsVal(f.smsNumber) || fsVal(f.phone)) : fsVal(f.smsNumber)) || null,
            website: fsVal(f.website) || null,
            email: null,
            address: fsVal(f.address) || null,
            discount: fsVal(f.discount) || null,
            afterHours: fsVal(f.afterHours) === true,
            parishionerOwned: fsVal(f.parishionerOwned) === true,
            logo: fsVal(f.logoUrl) || null,
            modalLogo: fsVal(f.modalLogoUrl) || null,
            modalHero: fsVal(f.modalHeroUrl) || null,
            photos: [fsVal(f.photoUrl), fsVal(f.modalHeroUrl)].filter(Boolean),
            specialties,
            tier: (!isPro && rawTier === 'premium') ? 'premium' : 'standard',
            isPro,
          };
        })
        .filter(a => a.name && !a.isPro);
      if (mapped.length) ADVERTISERS = mapped.map((a, i) => ({ ...a, _idx: i }));
    } catch (e) {
      // keep ADVERTISERS_DEFAULTS
    }
    CATEGORIES = buildCategories(ADVERTISERS);
    renderFilters();
    render();
  }

  function escapeHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/`/g,'&#96;');
  }

  // Only allow safe schemes into an href — a directory listing's website/phone
  // fields come from Firestore (published from the public partnerRequests form),
  // so a value like `javascript:...` must never reach the DOM as a link target.
  function safeUrl(raw) {
    const s = String(raw || '').trim();
    if (/^https?:\/\//i.test(s)) return s;
    return '';
  }
  function safeTel(raw) {
    const digits = String(raw || '').replace(/[^0-9+().\s-]/g, '').trim();
    return digits ? 'tel:' + digits : '';
  }
  function safeSms(raw) {
    const digits = String(raw || '').replace(/[^0-9+().\s-]/g, '').trim();
    return digits ? 'sms:' + digits : '';
  }
  function safeMailto(raw) {
    const s = String(raw || '').trim();
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s) ? 'mailto:' + s : '';
  }

  function renderFilters() {
    const row = document.getElementById('filterRow');
    row.innerHTML = CATEGORIES.map((c, i) =>
      `<div class="filter-chip${c === activeCategory ? ' active' : ''}" onclick="setCategoryByIndex(${i})">${escapeHtml(c)}</div>`
    ).join('');
  }

  function setCategoryByIndex(i) {
    setCategory(CATEGORIES[i]);
  }

  function setCategory(c) {
    activeCategory = c;
    renderFilters();
    render();
  }

  // Tap-to-expand detail modal — content mirrors the app's Premium Detail Modal
  // (CommunityScreen.tsx ~L1178-1320) section for section: hero image + gallery,
  // logo/name/category, tagline, badges, About (falls back to plain description
  // when there's no separate `about` field, same as the app), Services chips,
  // discount box, address (Directions) + email, Call/Text/Website, share, and
  // the "PROUD ADVERTISER" footer.
  function openModal(idx) {
    const a = ADVERTISERS[idx];
    if (!a) return;

    const heroSrc = safeUrl(a.modalHero || (a.photos && a.photos[0]));
    const hero = heroSrc ? `<img class="modal-hero" src="${escapeHtml(heroSrc)}" alt="">` : '';

    const gallery = (a.photos || []).map(safeUrl).filter(p => p && p !== heroSrc);
    const galleryHtml = gallery.length ? `<div class="modal-gallery">${gallery.map(p => `<img src="${escapeHtml(p)}" alt="">`).join('')}</div>` : '';

    const logoSrc = safeUrl(a.modalLogo || a.logo);
    const logoImg = logoSrc ? `<img class="modal-logo" src="${escapeHtml(logoSrc)}" alt="">` : '';

    const tagline = a.tagline ? `<div class="modal-tagline">${escapeHtml(a.tagline)}</div>` : '';

    const badges = `<div class="modal-badges">
        <div class="modal-badge advertiser">Advertiser</div>
        ${a.parishionerOwned ? '<div class="modal-badge parish">Parishioner Owned</div>' : ''}
        ${a.afterHours ? '<div class="modal-badge hours">After Hours</div>' : ''}
      </div>`;

    const aboutBlock = a.about
      ? `<div class="modal-heading">About</div><div class="modal-body-text">${escapeHtml(a.about)}</div>`
      : `<div class="modal-body-text">${escapeHtml(a.description)}</div>`;

    const specialties = (a.specialties || []).length
      ? `<div class="modal-heading">Services</div><div class="modal-chips">${a.specialties.map(s => `<div class="modal-chip">${escapeHtml(s)}</div>`).join('')}</div>`
      : '';

    const offer = a.discount
      ? `<div class="modal-offer"><span class="pct system-font">%</span><span class="text">${escapeHtml(a.discount)}</span></div>`
      : '';

    const addressRow = a.address
      ? `<a class="modal-row" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a.address)}" target="_blank" rel="noopener">
          <span class="label">📍 ${escapeHtml(a.address)}</span><span class="directions">Directions →</span>
        </a>`
      : '';
    const emailHref = safeMailto(a.email);
    const emailRow = emailHref
      ? `<a class="modal-row" href="${escapeHtml(emailHref)}"><span class="label">✉️ ${escapeHtml(a.email)}</span></a>`
      : '';

    const tel = safeTel(a.phone), sms = safeSms(a.smsNumber), web = safeUrl(a.website);
    const actions = `<div class="modal-actions">
        ${tel ? `<a class="modal-btn call" href="${escapeHtml(tel)}">Call</a>` : ''}
        ${sms ? `<a class="modal-btn text" href="${escapeHtml(sms)}">Text</a>` : ''}
        ${web ? `<a class="modal-btn web" href="${escapeHtml(web)}" target="_blank" rel="noopener">Website</a>` : ''}
      </div>`;

    document.getElementById('modalCard').innerHTML = `
      <button class="modal-close" onclick="closeModal()">✕</button>
      ${hero}
      ${galleryHtml}
      <div class="modal-headrow">
        ${logoImg}
        <div>
          <div class="modal-name">${escapeHtml(a.name)}</div>
          <div class="modal-cat">${escapeHtml(a.category)}</div>
        </div>
      </div>
      ${tagline}
      ${badges}
      <div class="modal-divider"></div>
      ${aboutBlock}
      ${specialties}
      ${offer}
      <div class="modal-divider"></div>
      ${addressRow}
      ${emailRow}
      ${actions}
      <div class="modal-share" onclick="shareListing(event, ${idx})">Share this business</div>
      <div class="modal-footer">PROUD ADVERTISER</div>
    `;
    document.getElementById('modalOverlay').classList.add('open');
    document.addEventListener('keydown', onModalKeydown);
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.removeEventListener('keydown', onModalKeydown);
  }

  function onModalKeydown(ev) {
    if (ev.key === 'Escape') closeModal();
  }

  function shareListing(ev, idx) {
    ev.stopPropagation();
    const a = ADVERTISERS[idx];
    const text = a.name + ' - ' + a.description + (a.phone ? ' Call: ' + a.phone : '') + (a.website ? ' ' + a.website : '') + ' | Found on the SaintRose App';
    const el = ev.currentTarget;
    if (navigator.share) {
      navigator.share({ title: a.name, text }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        const original = el.textContent;
        el.textContent = 'Copied!';
        setTimeout(() => { el.textContent = original; }, 1500);
      }).catch(() => {});
    }
  }

  function logoHtml(a) {
    const src = safeUrl(a.logo);
    return src
      ? `<img src="${escapeHtml(src)}" alt="" />`
      : `<span class="letter system-font">${escapeHtml((a.name || '?').charAt(0))}</span>`;
  }

  function cardHtml(a) {
    const isPremium = a.tier === 'premium';
    const tel = safeTel(a.phone);
    const sms = safeSms(a.smsNumber);
    const web = safeUrl(a.website);
    const email = safeMailto(a.email);

    if (isPremium) {
      const badges = (a.parishionerOwned || a.afterHours) ? `
        <div class="badge-row">
          ${a.parishionerOwned ? '<div class="badge-parish">Parishioner Owned</div>' : ''}
          ${a.afterHours ? '<div class="badge-hours">After Hours</div>' : ''}
        </div>` : '';
      const offer = a.discount ? `
        <div class="offer"><span class="pct system-font">%</span><span class="text">${escapeHtml(a.discount)}</span></div>` : '';
      const callBtn = tel ? `<a class="btn btn-call" href="${escapeHtml(tel)}" onclick="event.stopPropagation()">Call</a>` : '';
      const textBtn = sms ? `<a class="btn btn-text" href="${escapeHtml(sms)}" onclick="event.stopPropagation()">Text</a>` : '';
      const webBtn = web ? `<a class="btn btn-web" href="${escapeHtml(web)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Website</a>` : '';
      return `
      <div class="card-premium" onclick="openModal(${a._idx})">
        <div class="premium-hero">
          <div class="premium-logo">${logoHtml(a)}</div>
          <div class="premium-headtext">
            <div class="name">${escapeHtml(a.name)}</div>
            <div class="cat">${escapeHtml(a.category)}</div>
          </div>
        </div>
        <div class="premium-body">
          ${badges}
          <div class="desc">${escapeHtml(a.description)}</div>
          ${offer}
          <div class="action-row">${callBtn}${textBtn}${webBtn}</div>
          <div class="share-btn" onclick="shareListing(event, ${a._idx})">Share this listing</div>
          <div class="tap-more">Tap to learn more</div>
        </div>
      </div>`;
    }

    const photo = safeUrl(a.logo || (a.photos && a.photos[0]));
    const photoHtml = photo ? `<img class="standard-photo" src="${escapeHtml(photo)}" alt="" />` : '';
    const stop = 'onclick="event.stopPropagation()"';
    const callLink = tel ? `<a href="${escapeHtml(tel)}" ${stop}>Call</a>` : '';
    const textLink = sms ? `<a href="${escapeHtml(sms)}" ${stop}>Text</a>` : '';
    const webLink = web ? `<a href="${escapeHtml(web)}" target="_blank" rel="noopener" ${stop}>Website</a>` : '';
    const emailLink = email ? `<a href="${escapeHtml(email)}" ${stop}>Email</a>` : '';
    // The app's own standard-tier card isn't tappable (only Premium opens a detail
    // modal there) — made clickable here too, per explicit direction, so both
    // tiers get the same expand-for-detail affordance on the website.
    return `
      <div class="card-standard" onclick="openModal(${a._idx})">
        <div class="standard-inner">
          ${photoHtml}
          <div class="standard-text">
            <div class="name">${escapeHtml(a.name)}</div>
            <div class="cat">${escapeHtml(a.category)}</div>
            <div class="desc">${escapeHtml(a.description)}</div>
            <div class="standard-contact-row">${callLink}${textLink}${webLink}${emailLink}</div>
          </div>
        </div>
        <div class="share-btn" onclick="shareListing(event, ${a._idx})">Share this listing</div>
      </div>`;
  }

  function render() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const matches = a => {
      const matchCat = activeCategory === 'All' || a.category === activeCategory;
      const matchSearch = !q || a.name.toLowerCase().includes(q) || a.category.toLowerCase().includes(q) || a.description.toLowerCase().includes(q);
      return matchCat && matchSearch;
    };
    const byName = (x, y) => x.name.localeCompare(y.name);
    const premium = ADVERTISERS.filter(a => a.tier === 'premium' && matches(a)).sort(byName);
    const standard = ADVERTISERS.filter(a => a.tier !== 'premium' && matches(a)).sort(byName);
    const wrap = document.getElementById('listingsWrap');

    if (premium.length === 0 && standard.length === 0) {
      wrap.innerHTML = '<div class="empty-state">No advertisers match your search.</div>';
      return;
    }

    let html = '';
    if (premium.length) {
      html += '<div class="tier-label">Premium Advertisers</div><div class="grid">' + premium.map(cardHtml).join('') + '</div>';
    }
    if (standard.length) {
      const label = premium.length > 0 ? 'More Advertisers' : 'Advertisers';
      html += `<div class="tier-divider"><div class="line"></div><div class="label">${label}</div><div class="line"></div></div><div class="grid">` + standard.map(cardHtml).join('') + '</div>';
    }
    wrap.innerHTML = html;
  }

  renderFilters();
  render();
  loadAdvertisers();
</script>
</body>
</html>
